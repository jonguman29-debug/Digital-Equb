<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Account | Digital Equb</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #111827, #243b55);
    }

    .box {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 35px 25px;
      border-radius: 18px;
      box-shadow: 0 15px 40px rgba(0,0,0,.25);
    }

    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #667085;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 17px;
      border: 1px solid #d0d5dd;
      border-radius: 9px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #f5b942;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #f5b942;
      color: #111827;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
      line-height: 1.5;
    }

    .login {
      text-align: center;
      margin-top: 20px;
      color: #667085;
    }

    .login a,
    .back {
      color: #111827;
      font-weight: bold;
      text-decoration: none;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
    }
  </style>
</head>


<body>

  <div class="box">

    <div class="logo">
      💰 Digital Equb
    </div>

    <p class="subtitle">
      Create your account
    </p>


    <form id="registerForm">

      <label for="name">
        Full Name
      </label>

      <input
        type="text"
        id="name"
        placeholder="Enter your name"
        required
      >


      <label for="email">
        Email
      </label>

      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >


      <label for="password">
        Password
      </label>

      <input
        type="password"
        id="password"
        placeholder="Create a password"
        minlength="6"
        required
      >


      <label for="confirmPassword">
        Confirm Password
      </label>

      <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm your password"
        minlength="6"
        required
      >


      <button
        type="submit"
        id="registerBtn">

        Create Account

      </button>


      <div id="message"></div>

    </form>


    <div class="login">

      Already have an account?

      <a href="login.html">
        Login
      </a>

    </div>


    <a
      href="index.html"
      class="back">

      ← Back to Home

    </a>

  </div>


  <script type="module">

    import {
      createUserWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";


    import {
      doc,
      setDoc
    } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


    import {
      auth,
      db
    } from "./firebase-config.js";


    const form =
      document.getElementById("registerForm");

    const button =
      document.getElementById("registerBtn");

    const message =
      document.getElementById("message");


    form.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();


        const name =
          document
            .getElementById("name")
            .value
            .trim();


        const email =
          document
            .getElementById("email")
            .value
            .trim();


        const password =
          document
            .getElementById("password")
            .value;


        const confirmPassword =
          document
            .getElementById("confirmPassword")
            .value;


        message.textContent = "";


        if (password !== confirmPassword) {

          message.style.color = "red";

          message.textContent =
            "❌ Passwords do not match.";

          return;

        }


        if (password.length < 6) {

          message.style.color = "red";

          message.textContent =
            "❌ Password must be at least 6 characters.";

          return;

        }


        button.disabled = true;

        button.textContent =
          "Creating account...";


        try {

          const result =
            await createUserWithEmailAndPassword(
              auth,
              email,
              password
            );


          const user =
            result.user;


          await setDoc(
            doc(db, "users", user.uid),
            {
              name: name,
              email: email,
              contribution: 0,
              createdAt: new Date()
            }
          );


          message.style.color = "green";

          message.textContent =
            "✅ Account created successfully!";


          button.textContent =
            "Success ✓";


          setTimeout(() => {

            window.location.href =
              "login.html";

          }, 1200);


        } catch (error) {

          console.error(
            "Registration error:",
            error
          );


          message.style.color = "red";


          if (
            error.code ===
            "auth/email-already-in-use"
          ) {

            message.textContent =
              "❌ This email already has an account.";

          } else if (
            error.code ===
            "auth/invalid-email"
          ) {

            message.textContent =
              "❌ Please enter a valid email.";

          } else if (
            error.code ===
            "auth/weak-password"
          ) {

            message.textContent =
              "❌ Password must be at least 6 characters.";

          } else if (
            error.code ===
            "auth/operation-not-allowed"
          ) {

            message.textContent =
              "❌ Email/Password sign-in is not enabled in Firebase.";

          } else {

            message.textContent =
              "❌ " +
              (error.message ||
              "Account creation failed.");

          }


          button.disabled = false;

          button.textContent =
            "Create Account";

        }

      }
    );

  </script>

</body>

  </html>
